<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}{{ title }} | {{ subtitle }}{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        },
                        kahoot: {
                            red: '#e21b3c',
                            blue: '#1368ce',
                            yellow: '#eab308', /* Tailwind yellow-500 */
                            green: '#26890c'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Firebase JS SDK (Compat mode for ultra-reliable zero-build browser use) -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="h-full flex flex-col overflow-x-hidden antialiased bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black relative">
    <!-- Floating Tech & Startup Background Icons (Expanded & Fluid) -->
    <div class="floating-bg bg-floating-icons select-none" aria-hidden="true">
        <span class="float-icon floating-icon" style="top: 6%; left: 8%; animation-delay: 0s;">💡</span>
        <span class="float-icon" style="top: 14%; right: 10%; animation-delay: 2s;">⚡</span>
        <span class="float-icon" style="top: 32%; left: 5%; animation-delay: 4s;">🧠</span>
        <span class="float-icon" style="top: 45%; right: 7%; animation-delay: 1s;">🚀</span>
        <span class="float-icon" style="top: 65%; left: 12%; animation-delay: 3s;">🤖</span>
        <span class="float-icon" style="top: 76%; right: 14%; animation-delay: 5s;">✨</span>
        <span class="float-icon" style="top: 86%; left: 18%; animation-delay: 2.5s;">📈</span>
        <span class="float-icon" style="top: 22%; left: 42%; animation-delay: 6s;">🦄</span>
        <span class="float-icon" style="top: 70%; left: 48%; animation-delay: 3.5s;">🎯</span>
        <span class="float-icon" style="top: 12%; left: 75%; animation-delay: 1.5s;">💻</span>
        <span class="float-icon" style="top: 85%; right: 35%; animation-delay: 4.5s;">🔥</span>
        <span class="float-icon" style="top: 40%; left: 88%; animation-delay: 2.8s;">🌐</span>
        <span class="float-icon" style="top: 55%; left: 28%; animation-delay: 5.2s;">⚙️</span>
        <span class="float-icon" style="top: 28%; right: 25%; animation-delay: 3.2s;">🏆</span>
        <span class="float-icon" style="top: 92%; right: 8%; animation-delay: 1.8s;">🔮</span>
        <span class="float-icon" style="top: 5%; left: 25%; animation-delay: 4.2s;">💎</span>
        <span class="float-icon" style="top: 60%; right: 45%; animation-delay: 6.5s;">📊</span>
        <span class="float-icon" style="top: 38%; left: 62%; animation-delay: 0.8s;">🛡️</span>
        <span class="float-icon" style="top: 80%; left: 80%; animation-delay: 3.9s;">🪐</span>
        <span class="float-icon" style="top: 18%; left: 92%; animation-delay: 5.8s;">🛸</span>
    </div>

    <div class="relative z-10 flex flex-col flex-1 h-full">
        {% block content %}{% endblock %}
    </div>

    <!-- Procedural Audio Synthesizer -->
    <script src="/static/js/audio.js"></script>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Firebase Web Client Config (Injected safely from server)
        window.FIREBASE_CONFIG = {{ firebase_config | tojson if firebase_config else '{}' }};
        if (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.enabled && window.FIREBASE_CONFIG.apiKey) {
            try {
                firebase.initializeApp(window.FIREBASE_CONFIG);
                window.firestoreDb = firebase.firestore();
                console.log("[Aura] Firebase Web SDK successfully connected!");
            } catch (err) {
                console.warn("[Aura] Firebase client init skipped/fallback:", err);
            }
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
